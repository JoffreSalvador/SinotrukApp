name: sinotruk_app
description: Sinotruk Transport - gestion de viajes, gastos y cuentas (Flutter + Supabase online-first)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # Utilidades
  uuid: ^4.4.0

  # UI / estado
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.example